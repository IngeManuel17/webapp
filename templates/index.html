<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel DynamoDB</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f3f4f6; color: #222; }
  header { background: #232f3e; color: #fff; padding: 14px 24px; display: flex;
           justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  header h1 { margin: 0; font-size: 20px; }
  header a { background: #ff9900; color: #000; padding: 8px 14px; border-radius: 4px;
             text-decoration: none; font-weight: bold; font-size: 14px; }
  .wrap { max-width: 1100px; margin: 20px auto; padding: 0 16px; }

  .resumen { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .dato { flex: 1; min-width: 150px; background: #fff; border: 1px solid #d9d9d9; border-radius: 4px; padding: 12px; }
  .dato small { color: #666; display: block; }
  .dato b { font-size: 22px; }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tabs button { padding: 8px 14px; border: 1px solid #bbb; background: #fff; cursor: pointer; border-radius: 4px; }
  .tabs button.on { background: #232f3e; color: #fff; border-color: #232f3e; }

  .panel { background: #fff; border: 1px solid #d9d9d9; border-radius: 4px; }
  .barra { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
           gap: 10px; padding: 12px; border-bottom: 1px solid #d9d9d9; }
  .barra h2 { margin: 0; font-size: 18px; text-transform: capitalize; }
  .barra .n { color: #666; font-size: 13px; margin-left: 6px; }
  input { padding: 8px; border: 1px solid #bbb; border-radius: 4px; font-size: 14px; }
  button.b { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; color: #fff; font-size: 14px; }
  .verde { background: #2e7d32; } .azul { background: #1565c0; }
  .rojo { background: #c62828; } .gris { background: #757575; }

  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 12px; border-bottom: 1px solid #e5e5e5; text-align: left; white-space: nowrap; }
  th { background: #f0f0f0; cursor: pointer; user-select: none; }
  th.sin { cursor: default; }
  tr:hover td { background: #fafafa; }
  td.acc button { padding: 4px 10px; margin-left: 4px; cursor: pointer; border: 1px solid #bbb;
                  background: #fff; border-radius: 4px; }
  td.acc button.x { color: #c62828; border-color: #c62828; }
  .msg { padding: 30px; text-align: center; color: #666; }
  .err { color: #c62828; }

  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none;
        align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .ov.on { display: flex; }
  .modal { background: #fff; border-radius: 6px; padding: 20px; width: 420px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 4px; }
  .modal p { color: #666; font-size: 14px; margin: 0 0 14px; }
  .campo { margin-bottom: 12px; }
  .campo label { display: block; font-size: 13px; margin-bottom: 4px; color: #444; }
  .campo input { width: 100%; }
  .fila { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .ferr { color: #c62828; font-size: 13px; min-height: 16px; }

  #toast { position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff; padding: 12px 18px;
           border-radius: 4px; display: none; z-index: 20; }
  #toast.on { display: block; }
  #toast.bad { background: #c62828; }
</style>
</head>
<body>

<header>
  <h1>Panel DynamoDB · EC2 + Flask</h1>
  <a href="/consultas">Ir a Consultas</a>
</header>

<div class="wrap">
  <div class="resumen">
    <div class="dato"><small>Clientes</small><b id="k-clientes">…</b></div>
    <div class="dato"><small>Productos</small><b id="k-productos">…</b></div>
    <div class="dato"><small>Ventas</small><b id="k-ventas">…</b></div>
    <div class="dato"><small>Ingresos</small><b id="k-ingresos">…</b></div>
  </div>

  <div class="tabs" id="menu">
    {% for t in tablas %}<button data-t="{{ t }}">{{ t|capitalize }}</button>{% endfor %}
  </div>

  <div class="panel">
    <div class="barra">
      <div><h2 style="display:inline" id="titulo">Selecciona una tabla</h2><span class="n" id="cuenta"></span></div>
      <div>
        <input id="buscar" aria-label="Buscar" placeholder="Buscar..." oninput="pintar()">
        <button class="b verde" onclick="abrirForm(null)">+ Nuevo</button>
      </div>
    </div>
    <div class="scroll" id="contenido"><div class="msg">Elige una tabla.</div></div>
  </div>
</div>

<!-- Crear / editar -->
<div class="ov" id="ovForm">
  <div class="modal">
    <h3 id="fTitulo">Formulario</h3>
    <p id="fSub"></p>
    <div id="fCampos"></div>
    <div class="ferr" id="fErr"></div>
    <div class="fila">
      <button class="b gris" onclick="cerrar('ovForm')">Cancelar</button>
      <button class="b azul" id="fGuardar" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<!-- Eliminar -->
<div class="ov" id="ovDel">
  <div class="modal">
    <h3>Eliminar registro</h3>
    <p id="dTexto"></p>
    <div class="fila">
      <button class="b gris" onclick="cerrar('ovDel')">Cancelar</button>
      <button class="b rojo" onclick="confirmarEliminar()">Eliminar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let datos = [], cols = [], tipos = {}, clave = "", vista = [];
  let orden = {col: null, asc: true}, actual = "", editando = null, porBorrar = null;

  const $ = id => document.getElementById(id);
  const cop = n => "$" + Number(n).toLocaleString("es-CO");
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  function toast(texto, ok = true) {
    const t = $("toast");
    t.textContent = texto;
    t.className = "on" + (ok ? "" : " bad");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.className = "", 3000);
  }

  function celda(col, v) {
    if (v === undefined || v === null) return "";
    if (/^(precio|total)$/.test(col)) return cop(v);
    return esc(v);
  }

  function pintar() {
    const q = $("buscar").value.toLowerCase();
    vista = datos.filter(d => JSON.stringify(d).toLowerCase().includes(q));
    if (orden.col) vista.sort((a, b) => {
      const x = a[orden.col] ?? "", y = b[orden.col] ?? "";
      return (x > y ? 1 : x < y ? -1 : 0) * (orden.asc ? 1 : -1);
    });
    $("cuenta").textContent = "(" + vista.length + " registros)";
    if (!vista.length) {
      $("contenido").innerHTML = '<div class="msg">Sin registros.</div>';
      return;
    }
    let h = "<table><thead><tr>" + cols.map(c =>
      `<th onclick="ordenar('${c}')">${esc(c)}${orden.col === c ? (orden.asc ? " ▲" : " ▼") : ""}</th>`).join("")
      + '<th class="sin">Acciones</th></tr></thead><tbody>';
    vista.forEach((f, i) => {
      h += "<tr>" + cols.map(c => `<td>${celda(c, f[c])}</td>`).join("") +
        `<td class="acc"><button onclick="abrirForm(${i})">Editar</button>` +
        `<button class="x" onclick="pedirEliminar(${i})">Eliminar</button></td></tr>`;
    });
    $("contenido").innerHTML = h + "</tbody></table>";
  }

  function ordenar(c) { orden = {col: c, asc: orden.col === c ? !orden.asc : true}; pintar(); }

  async function cargar(t) {
    actual = t; orden = {col: null, asc: true};
    $("buscar").value = "";
    $("titulo").textContent = t;
    document.querySelectorAll("#menu button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
    $("contenido").innerHTML = '<div class="msg">Cargando...</div>';
    try {
      const r = await fetch("/api/" + t);
      const d = await r.json();
      if (d.error) throw new Error(d.error);
      datos = d.items; cols = d.columnas; tipos = d.tipos; clave = d.clave;
      pintar();
    } catch (e) {
      $("cuenta").textContent = "";
      $("contenido").innerHTML = `<div class="msg err">Error: ${esc(e.message)}</div>`;
    }
  }

  async function resumen() {
    try {
      const d = await (await fetch("/api/resumen")).json();
      if (d.error) throw 0;
      ["clientes", "productos", "ventas"].forEach(k => $("k-" + k).textContent = d[k]);
      $("k-ingresos").textContent = cop(d.ingresos);
    } catch (e) {
      ["clientes", "productos", "ventas", "ingresos"].forEach(k => $("k-" + k).textContent = "—");
    }
  }

  function cerrar(id) { $(id).classList.remove("on"); }

  function abrirForm(i) {
    if (!cols.length) return;
    editando = i === null ? null : vista[i];
    $("fTitulo").textContent = editando ? "Editar registro" : "Nuevo registro";
    $("fSub").textContent = "Tabla: " + actual;
    $("fErr").textContent = "";
    $("fCampos").innerHTML = cols.map(c => {
      const esNum = tipos[c] === "N";
      const tipo = esNum ? "number" : (c === "fecha" ? "date" : "text");
      const val = editando && editando[c] !== undefined ? esc(editando[c]) : "";
      const ro = editando && c === clave ? "readonly" : "";
      return `<div class="campo"><label>${esc(c)}${c === clave ? " (ID)" : ""}</label>` +
             `<input id="f_${c}" type="${tipo}" ${esNum ? 'step="any"' : ""} value="${val}" ${ro}></div>`;
    }).join("");
    $("ovForm").classList.add("on");
    const primero = document.querySelector("#fCampos input:not([readonly])");
    if (primero) primero.focus();
  }

  async function guardar() {
    const cuerpo = {};
    cols.forEach(c => {
      const v = $("f_" + c).value.trim();
      if (v !== "") cuerpo[c] = tipos[c] === "N" ? Number(v) : v;
    });
    if (!cuerpo[clave]) { $("fErr").textContent = `El campo ${clave} es obligatorio.`; return; }
    const btn = $("fGuardar"); btn.disabled = true; btn.textContent = "Guardando...";
    try {
      const url = "/api/" + actual + (editando ? "/" + encodeURIComponent(editando[clave]) : "");
      const r = await fetch(url, {
        method: editando ? "PUT" : "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(cuerpo)
      });
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || "Error al guardar");
      cerrar("ovForm");
      toast(editando ? "Registro actualizado" : "Registro creado");
      await cargar(actual); resumen();
    } catch (e) {
      $("fErr").textContent = e.message;
    } finally {
      btn.disabled = false; btn.textContent = "Guardar";
    }
  }

  function pedirEliminar(i) {
    porBorrar = vista[i];
    $("dTexto").textContent = `Se eliminará el registro ${porBorrar[clave]} de la tabla ${actual}. No se puede deshacer.`;
    $("ovDel").classList.add("on");
  }

  async function confirmarEliminar() {
    try {
      const r = await fetch("/api/" + actual + "/" + encodeURIComponent(porBorrar[clave]), {method: "DELETE"});
      const d = await r.json();
      if (!r.ok || d.error) throw new Error(d.error || "Error al eliminar");
      cerrar("ovDel");
      toast("Registro eliminado");
      await cargar(actual); resumen();
    } catch (e) {
      cerrar("ovDel");
      toast(e.message, false);
    }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { cerrar("ovForm"); cerrar("ovDel"); }
    if (e.key === "Enter" && $("ovForm").classList.contains("on")) guardar();
  });

  document.querySelectorAll("#menu button").forEach(b => b.onclick = () => cargar(b.dataset.t));
  resumen();
  cargar("clientes");
</script>
</body>
</html>
